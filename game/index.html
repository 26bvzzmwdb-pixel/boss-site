    const when=nextT-AC.currentTime,pr=bossOn?PROG_B:PROG,ar=bossOn?ARP_B:ARP,root=pr[Math.floor(step/8)%4]+M.tr;
    if(!muted){

        tone(mf(root+24+ar[step%8]),0.15,"square",0.035,when);

let ptr=null;
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener("pointerdown",e=>{
  e.preventDefault();initAudio();startMusic();
  if(state!=="play"){uiTap(toLogical(e));return;}
  if(M.id==="climb"){ptr={id:e.pointerId,x:e.clientX,y:e.clientY,climb:true,done:false,lx:toLogical(e)};try{cv.setPointerCapture(e.pointerId);}catch(_){}return;}
  ptr={id:e.pointerId,x:e.clientX,y:e.clientY,slammed:false};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  doJump();
});
cv.addEventListener("pointermove",e=>{
  if(!ptr||ptr.id!==e.pointerId||state!=="play"||ptr.slammed)return;
  const dy=e.clientY-ptr.y,dx=e.clientX-ptr.x;
  if(ptr.climb){if(!ptr.done){if(dy>28&&dy>Math.abs(dx)*1.1){ptr.done=true;climbDuck();}else if(dy<-28&&-dy>Math.abs(dx)*1.1){ptr.done=true;climbJump();}}return;}
  if(dy>28&&dy>Math.abs(dx)*1.1){ptr.slammed=true;doSlam();}
});
const endPtr=e=>{if(ptr&&ptr.id===e.pointerId){if(ptr.climb&&!ptr.done&&state==="play"&&e.type==="pointerup")climbTap(ptr.lx);ptr=null;}};
cv.addEventListener("pointerup",endPtr);cv.addEventListener("pointercancel",endPtr);
cv.addEventListener("contextmenu",e=>e.preventDefault());
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if([" ","arrowup","arrowdown","w","s"].includes(k))e.preventDefault();
  if(k==="m"){muteBtn.click();return;}
  initAudio();startMusic();
  if(state==="play"&&M.id==="climb"){if(e.repeat)return;
    if(k==="arrowleft"||k==="a")climbMove(-1);else if(k==="arrowright"||k==="d")climbMove(1);
    else if(k===" "||k==="arrowup"||k==="w")climbJump();else if(k==="arrowdown"||k==="s")climbDuck();else if(k==="f")climbThrow();return;}
  if(state==="play"){if(e.repeat)return;if(k===" "||k==="arrowup"||k==="w")doJump();else if(k==="arrowdown"||k==="s")doSlam();return;}

function updFish(dt){

  else if(f.ph==="wait"){if(f.t>f.wait){f.ph="bite";f.t=0;sfx.alarm();burst(PX+250,GY,["#ffffff","#3ad0ff"],16,260);}}
  else if(f.ph==="bite"){f.m+=f.dir*dt*1.25;if(f.m>1){f.m=1;f.dir=-1;}if(f.m<0){f.m=0;f.dir=1;}if(f.t>5)fishEnd(false);}

// ================= update =================
function update(dt){
  if(state==="play")updPlay(dt);
  else if(state==="over")overT+=dt;
  updFx(dt);
}

  }else if(boss&&spiritT>0)spiritT=0;

    puT-=dt;if(puT<=0){spawnPowerup();puT=R(11,16);}}

      else if(hurt(q.k==="fud"?"FUD!":q.k==="finp"?"SHARK!":q.k==="batp"?"BAT!":q.k==="pk"?"SQUASHED!":q.k==="sign"?"-99%!":q.k==="wave"?"REKT!":"RUG!",q.x,qy)){q.dead=true;burst(q.x,qy,[RED,"#fff"],18,420);}
    }
    if(state!=="play")return;
  }
  bp=bp.filter(q=>!q.dead&&q.x>-200&&q.x<W+600);
  // ---- dust
  if(p.onGround&&Math.random()<dt*speed/40)parts.push({x:PX-20,y:GY-2,vx:-speed*0.4-R(0,80),vy:-R(20,120),life:0,max:0.35,c:isSurf()?(Math.random()<0.6?"#ffffff":"#8ae8ff"):(Math.random()<0.5?CYAN:PURP),g:300,s:2+Math.random()*2});
  score=Math.floor(dist)+Math.floor(bonus);
}
function updFx(dt){

  shake*=Math.pow(0.003,dt);flash*=Math.pow(0.001,dt);hitFlash*=Math.pow(0.01,dt);

const BOSS_NAMES={rug:"THE RUG PULLER",bear:"BEAR MARKET",pumpkin:"THE PUMPKIN KING",shark:"MEGALODON BEAR"};

function bossBox(pad=0){const b=boss,hw=b.type==="rug"?62:80,hh=b.type==="rug"?180:165;return{x1:b.x-hw-pad,x2:b.x+hw+pad,y1:b.y-hh-pad,y2:b.y};}
function updBoss(dt,pb){
  const b=boss;b.pt+=dt;b.fightT+=dt;if(b.flash>0)b.flash-=dt;
  const BX=bossBX(),HY=bossHover(),gap=1.25-0.15*(3-b.hp);
  const ease=(a,t)=>a+(t-a)*Math.min(1,dt*4);
  switch(b.phase){
    case"enter":b.x=ease(b.x,BX);b.y=HY+Math.sin(b.fightT*3)*12;if(b.pt>1.6){setPhase("attack");b.atkLeft=3+(3-b.hp);b.atkT=0.5;}break;
    case"attack":b.x=ease(b.x,BX);b.y=HY+Math.sin(b.fightT*3)*12;
      b.atkT-=dt;if(b.atkT<=0){if(b.atkLeft>0){b.atkLeft--;b.atkT=gap;bossAttack();}else setPhase("dive");}break;
    case"charge":
      if(b.pt<0.7){b.y=ease(b.y,GY);b.x=ease(b.x,BX+20);}
      else{b.y=GY;b.x-=980*dt;if(ov(pb,bossBox()))hurt("BEARISH!",PX,p.y-60);
        if(b.x<-240){b.x=W+240;b.y=HY;setPhase("return");}}
      break;
    case"return":b.x=ease(b.x,BX);b.y=HY+Math.sin(b.fightT*3)*12;if(b.pt>0.9){b.phase="attack";b.atkT=gap*0.6;}break;
    case"dive":b.y=ease(b.y,GY);b.x=ease(b.x,BX);if(b.pt>0.55){b.y=GY;setPhase("vuln");shake=Math.max(shake,0.35);sfx.impact();burst(b.x,GY,[PURP,CYAN],20,400,1200);popup(b.x,GY-230,"SLAM IT!",GOLD,40);}break;
    case"vuln":b.y=GY;b.x-=250*dt;
      if(p.slam&&ov(pb,bossBox(18))){ // slammed!
        b.hp--;b.flash=0.5;setPhase("hurt");shake=1;flash=1;sfx.bossHit();
        burst(b.x,GY-90,[GOLD,CYAN,PURP,"#ffffff"],60,700);ring(b.x,GY-80,GOLD,260);
        p.vy=-1250;p.slam=false;p.jumps=1;p.onGround=false;bonus+=500*mult();
        popup(b.x,GY-260,b.hp>0?`HIT ${3-b.hp}/3!`:"FINAL HIT!",GOLD,48);
      }else if(b.x<PX-150){popup(PX+150,GY-300,"MISSED! JUMP + SWIPE DOWN",PINK,24);setPhase("recover");}
      break;
    case"recover":b.x=ease(b.x,BX);b.y=ease(b.y,HY);if(b.pt>1.0){b.phase="attack";b.atkLeft=3+(3-b.hp);b.atkT=0.5;}break;
    case"hurt":if(b.hp<=0){setPhase("dying");break;}b.x=ease(b.x,BX);b.y=ease(b.y,HY);if(b.pt>1.0){b.phase="attack";b.atkLeft=3+(3-b.hp);b.atkT=0.6;}break;
    case"dying":b.y=ease(b.y,GY-60);if(Math.random()<dt*14)burst(b.x+R(-80,80),b.y-R(20,180),[RED,GOLD,CYAN,PURP],18,520);shake=Math.max(shake,0.25);
      if(b.pt>1.7)finishBoss();break;
  }
}

function inRange(e){return climbY>=e.wy-10&&climbY<=e.wy+e.len;}
function updClimb(dt){
  const PYv=cPY();p.y=PYv;p.onGround=true;runT+=dt;
  if(invuln>0)invuln-=dt;if(shieldT>0)shieldT-=dt;if(pumpT>0)pumpT-=dt;if(moonT>0)moonT-=dt;if(magnetT>0)magnetT-=dt;
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  if(cl.duck>0)cl.duck-=dt;if(cl.jump>0)cl.jump-=dt;if(cl.jcd>0)cl.jcd-=dt;if(cl.thr>0)cl.thr-=dt;
  cl.x+=(LX[cl.lane]-cl.x)*Math.min(1,dt*18);
  if(cb){updTRex(dt);score=Math.floor(dist)+Math.floor(bonus);return;}
  if(!bossPending){bossClock+=dt;if(bossClock>=BOSS_EVERY){bossPending=true;bossWait=0;popup(W/2,PYv-460,"⚠ SOMETHING BIG IS COMING...",RED,26);}}
  else{bossWait+=dt;if(bossWait>1.8)startTRex();}
  const target=bossPending?120:Math.min(430,210+runT*1.2);cspd+=(target-cspd)*Math.min(1,dt*2);
  let vine=false;for(const e of cents)if(e.k==="vine"&&e.lane===cl.lane&&inRange(e)){vine=true;break;}
  const dy=cspd*(vine?1.9:1)*(cl.duck>0?0.45:1)*dt+(cl.jump>0?520*dt:0);
  climbY+=dy;dist=climbY/40;scroll=climbY;mcap*=1+dt*0.012*(cspd/250);athMcap=Math.max(athMcap,mcap);
  if(vine){bonus+=25*dt*mult();if(Math.random()<dt*12)parts.push({x:cl.x+R(-20,20),y:PYv-R(0,90),vx:R(-40,40),vy:R(40,120),life:0,max:0.5,c:"#5ac83a",g:200,s:3});}
  if(!bossPending)while(cnext<climbY+PYv+200)cnext+=spawnClimb(cnext);
  for(const e of cents){
    if(e.dead)continue;const sy=PYv-(e.wy-climbY);
    switch(e.k){
      case"gap":if(inRange(e)&&e.lane===cl.lane&&cl.jump<=0&&!e.hit){e.hit=true;climbHurt("SLIPPED!");}break;
      case"crumble":if(!e.broken&&inRange(e)&&e.lane===cl.lane&&cl.jump<=0){e.t+=dt;if(e.t>0.7){e.broken=true;burst(LX[e.lane],PYv-40,["#8a6a4a","#c8a070"],20,320);climbHurt("CRUMBLED!");}}
        else if(e.t>0&&!e.broken&&!inRange(e)&&climbY>e.wy+e.len){e.broken=true;}break;
      case"vent":case"cave":{
        const warn=e.k==="vent"?1.0:0.8,act=e.k==="vent"?0.9:1.0;
        if(!e.st&&sy>PYv-cspd*warn-150){e.st="warn";e.t=0;}
        if(e.st){e.t+=dt;if(e.st==="warn"&&e.t>warn){e.st="on";e.t=0;if(e.k==="vent")noise(0.4,0.15);else sfx.attack();}else if(e.st==="on"&&e.t>act){e.st="done";}}
        if(e.st==="on"&&!e.hit&&e.lane===cl.lane&&Math.abs(sy-PYv+40)<75&&cl.jump<=0){e.hit=true;climbHurt(e.k==="vent"?"STEAMED!":"DINO CHOMP!");}
        break;}
      case"rock":e.t+=dt;if(e.t>1.0){e.sy+=1050*dt;if(!e.hit&&e.lane===cl.lane&&Math.abs(e.sy-(PYv-50))<(e.big?62:50)){e.hit=true;climbHurt(e.big?"BOULDER!":"ROCK!");}if(e.sy>H+80)e.dead=true;}break;
      case"ptero":e.t+=dt;if(e.t>1.1){e.x+=e.dir*950*dt;if(!e.hit&&Math.abs(e.x-cl.x)<60&&cl.duck<=0){e.hit=true;climbHurt("PTERO!");}
        if(!e.hit&&!e.passed&&(e.dir>0?e.x>cl.x+60:e.x<cl.x-60)){e.passed=true;if(cl.duck>0){bonus+=100*mult();popup(cl.x,PYv-150,"DUCKED!",CYAN,28);}}
        if(e.x<-200||e.x>W+200)e.dead=true;}break;
      case"coin":case"amber":case"bone":case"pu":if(e.lane===cl.lane&&Math.abs(sy-(PYv-50))<55)climbCollect(e);break;
    }
    if(state!=="play")return;
    if(e.wy!==undefined&&sy-(e.len||0)>H+200)e.dead=true;
  }
  cents=cents.filter(e=>!e.dead);
  score=Math.floor(dist)+Math.floor(bonus);
}

function tAttack(){

function updTRex(dt){

  cpk=cpk.filter(q=>!q.got&&q.t<7);

  }else if(a.k==="tail"){
    if(a.ph==="tele"&&a.t>1.0){a.ph="go";a.t=0;}

  }

  const rdt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;clock+=rdt;
  try{
    if(state==="play"){let total=rdt*timeScale;while(total>1e-6&&state==="play"){const d=Math.min(total,1/60);update(d);total-=d;}}
    else{update(rdt);scroll+=rdt*(state==="over"?0:260);}
    render();
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
function render(){
  ctx.setTransform(DPR*scale,0,0,DPR*scale,0,0);
  let sx=0,sy=0;if(shake>0.02){const a=20*shake;sx=(Math.random()*2-1)*a;sy=(Math.random()*2-1)*a;}
  ctx.save();ctx.translate(sx,sy);
  drawBG(clock);
  const inRun=state==="play"||state==="over";
  if(inRun&&M.id==="climb"){drawClimb(clock);}
  else if(inRun){
    for(const e of ents){if(e.k==="red")drawRed(e);else if(e.k==="g")drawGreen(e,clock);else if(e.k==="ghost")drawGhost(e,clock);else if(e.k==="bat")drawBat(e.x,entY(e),e.ph,1);else if(e.k==="candy")drawCandy(e);else if(e.k==="press")drawPress(e,clock);else if(e.k==="rock")drawRock(e);else if(e.k==="met")drawMeteor(e,clock);else if(e.k==="shark")drawFin(e.x,GY,clock,1);else if(e.k==="leap")drawLeap(e,clock);else if(e.k==="ramp")drawRamp(e,clock);else if(e.k==="tube")drawTube(e,clock);else if(e.k==="coin")drawCoin(e,clock);else if(e.k==="fud")drawFud(e.x,e.y+Math.sin(e.ph*3)*14,e.r,clock);else if(e.k==="pu")drawPU(e,clock);}
    drawBoss(clock);for(const q of bp)drawProj(q,clock);
    drawPlayer(clock);
  }else if(state==="skinhero"){}
  else if(M.id!=="ohio"){ // attract mode: the map's character hops along on the menus
    const ph=clock*3%Math.PI,yb=GY-Math.sin(ph)*120;ctx.save();ctx.translate(PX,yb);if(isSurf())drawSurfBoard();
    drawChar(M.id,clock,{ground:ph<0.12||ph>Math.PI-0.12,vy:Math.cos(ph)>0?-1:1,slam:false,hurt:false,surf:isSurf(),spin:false});ctx.restore();
  }else if(spr.complete&&spr.naturalWidth){ // attract mode: the crown hops along on the menus
    const yb=GY-Math.abs(Math.sin(clock*3))*120;ctx.globalAlpha=0.9;ctx.drawImage(spr,PX-52,yb-110,104,114);ctx.globalAlpha=1;ctx.save();ctx.translate(PX,yb);skinHat(-116,clock);ctx.restore();
  }
  if(inRun)drawFx();
  ctx.restore();
  if(spiritT>0&&state==="play"){ctx.fillStyle=`rgba(150,80,255,${0.07+0.03*Math.sin(clock*4)})`;ctx.fillRect(0,0,W,H);}
  if(flash>0.02){ctx.fillStyle=`rgba(40,255,140,${0.08*flash})`;ctx.fillRect(0,0,W,H);}
  if(hitFlash>0.02){ctx.fillStyle=`rgba(255,40,70,${0.3*hitFlash})`;ctx.fillRect(0,0,W,H);}
  if(inRun)drawHUD(clock);
  if(state==="play")drawBanner(clock);
  if(fish&&state==="play")drawFishUI(clock);
  drawScreens(clock);
  if(state==="shop"||state==="skins")drawFx();
  if(!scanPat){const s=document.createElement("canvas");s.width=4;s.height=3;const g=s.getContext("2d");g.fillStyle="rgba(0,0,0,0.2)";g.fillRect(0,0,4,1);scanPat=ctx.createPattern(s,"repeat");}
  ctx.fillStyle=scanPat;ctx.fillRect(0,0,W,H);
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.75);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,0.4)");ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
reset();resize();
let HERO_SPEED=430;if(TESTQ==="skins")window.__skins={pose(o){HERO_SPEED=o;},go(m,id,st){const i=MAPS.findIndex(x=>x.id===m);if(i>=0){mapIdx=i;M=MAPS[i];bgGrad=null;loadMapStats();}skinTry=id||null;if(st==="play"){state="title";tryBegin();skinTry=id;}else state=st||"title";},state:()=>state}; // render previews only (try-on)
if(TESTQ)window.__dbg=()=>({state,ramp:p.ramp,spin:p.spin,tricks:p.tricks.slice(),onGround:p.onGround,lives,maxLives,fish:fish&&fish.ph,m:fish&&fish.m,zone:fish&&fish.zone,boss:boss&&{hp:boss.hp,phase:boss.phase},score,climb:cl&&{lane:cl.lane,spears:cl.spears,y:climbY},trex:cb&&{hp:cb.hp,st:cb.st,atk:cb.atk&&{k:cb.atk.k,ph:cb.atk.ph,safe:cb.atk.safe,lane:cb.atk.lane},pk:cpk.map(q=>q.lane)}});
if(document.fonts&&document.fonts.load)document.fonts.load(`800 30px Orbitron`).then(()=>{layers=null;}).catch(()=>{});
document.addEventListener("visibilitychange",()=>{last=performance.now();});
requestAnimationFrame(frame);
})();
</script>
