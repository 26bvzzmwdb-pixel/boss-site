function initAudio(){
  if(AC){if(AC.state==="suspended")AC.resume();return;}
  const Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)return;
  try{AC=new Ctor();master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination);}catch(e){AC=null;}
}
function tone(f,dur,type="square",vol=0.15,when=0,slide=0){
  if(!AC||muted)return;
  const t=AC.currentTime+Math.max(0,when),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}

function noise(dur,vol=0.2,when=0){
  if(!AC||muted)return;
  if(!noiseBuf){const n=AC.sampleRate|0;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}

  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);
}

function musicTick(){ // lookahead scheduler; 150bpm 8ths like the promo track, faster + minor during boss fights
  if(!AC)return;
  while(nextT<AC.currentTime+0.25){
    const bossOn=state==="play"&&!!boss,stepDur=bossOn?0.16:0.2;
    const when=nextT-AC.currentTime,pr=bossOn?PROG_B:PROG,ar=bossOn?ARP_B:ARP,root=pr[Math.floor(step/8)%4];
    if(!muted){
      if(state==="play"){
        tone(mf(root+24+ar[step%8]),0.15,"square",0.035,when);
        if(step%2===0)tone(mf(root),0.28,"triangle",0.12,when);
        if(step%4===0)tone(150,0.15,"sine",0.32,when,0.25);
        if(step%4===2)noise(0.05,0.07,when);
        if(bossOn&&step%2===1)noise(0.025,0.03,when);
      }else if(step%2===0){tone(mf(root+12+ar[step%8]),0.3,"triangle",0.04,when);}
    }

  }
}

function burst(x,y,cols,n,sp,grav=900){for(let i=0;i<n&&parts.length<500;i++){const a=Math.random()*Math.PI*2,s=sp*(0.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*0.3,life:0,max:0.35+Math.random()*0.5,c:cols[i%cols.length],g:grav,s:2+Math.random()*4});}}
function popup(x,y,text,col,size=34){if(pops.length>14)pops.shift();pops.push({x,y,text,col,age:0,size});}
function ring(x,y,col,max=160){rings.push({x,y,col,r:10,max,age:0});}
const GOOD=["PUMP!","WAGMI","SEND IT","BULLISH","LFG","HODL","GIGA PUMP","ATH!"];

// ---------- spawning ----------
function addRed(x,h){ents.push({k:"red",x,w:44,h});}
function addPit(x,w){pits.push({x,w,filled:false});}
function addFud(x,alt){ents.push({k:"fud",x,y:GY-alt,r:44,ph:Math.random()*6});}
function addGreen(x,alt){ents.push({k:"g",x,y:GY-alt,ph:Math.random()*6});}
function addCoin(x,alt){ents.push({k:"coin",x,y:GY-alt,ph:Math.random()*6});}
function coinArc(x0,len,peak,n){for(let i=0;i<n;i++){const t=n===1?0.5:i/(n-1);addCoin(x0+t*len,60+peak*4*t*(1-t));}}
function spawnPattern(){
  const d=difficulty(),x=W+80,air=speed*0.76;   // horizontal distance covered by one jump
  const r=Math.random();let len=200;
  if(r<0.2){const h=R(70,130+50*d);addRed(x,h);coinArc(x-air*0.5,air,200,5);len=120;}
  else if(r<0.36){const w=R(150,190+90*d);addPit(x,w);coinArc(x+w*0.5-air*0.5,air,190,5);len=w+60;}
  else if(r<0.48){const g=Math.max(air*0.95,R(260,360));addRed(x,R(70,120));addRed(x+g,R(70,130));for(let i=0;i<3;i++)addCoin(x+g*0.3+i*g*0.2,70);len=g+100;}
  else if(r<0.58){addRed(x,R(70,110));addFud(x+air*1.05+R(0,80),R(170,230));len=air*1.3+150;}
  else if(r<0.7){const n=4+Math.floor(R(0,3));for(let i=0;i<n;i++)addGreen(x+i*95,150+Math.sin(i/(n-1)*Math.PI)*90);for(let i=0;i<n;i++)addCoin(x+i*95,60);len=n*95+60;}
  else if(r<0.8){addRed(x,R(185,212));coinArc(x-air*0.55,air*1.1,330,6);len=160;}
  else if(r<0.9&&d>0.15){const w=R(140,190);addPit(x,w);addRed(x+w+air*0.75,R(70,120));coinArc(x+w*0.5-air*0.5,air,190,4);len=w+air+120;}
  else{addFud(x,R(150,190));addFud(x+170,R(200,250));for(let i=0;i<5;i++)addCoin(x-60+i*80,60);len=330;}
  return len;
}
function spawnPowerup(){const kinds=["shield","pump","moon","magnet"];ents.push({k:"pu",kind:kinds[Math.floor(Math.random()*4)],x:W+60,y:GY-R(150,210),ph:0});}

// ---------- input ----------
let ptr=null;
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener("pointerdown",e=>{
  e.preventDefault();initAudio();startMusic();
  if(state!=="play"){uiTap(toLogical(e));return;}
  ptr={id:e.pointerId,x:e.clientX,y:e.clientY,slammed:false};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  doJump();
});
cv.addEventListener("pointermove",e=>{
  if(!ptr||ptr.id!==e.pointerId||state!=="play"||ptr.slammed)return;
  const dy=e.clientY-ptr.y,dx=e.clientX-ptr.x;
  if(dy>28&&dy>Math.abs(dx)*1.1){ptr.slammed=true;doSlam();}
});
const endPtr=e=>{if(ptr&&ptr.id===e.pointerId)ptr=null;};
cv.addEventListener("pointerup",endPtr);cv.addEventListener("pointercancel",endPtr);
cv.addEventListener("contextmenu",e=>e.preventDefault());
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if([" ","arrowup","arrowdown","w","s"].includes(k))e.preventDefault();
  if(k==="m"){muteBtn.click();return;}
  initAudio();startMusic();
  if(state==="play"){if(e.repeat)return;if(k===" "||k==="arrowup"||k==="w")doJump();else if(k==="arrowdown"||k==="s")doSlam();return;}
  if(e.repeat)return;
  if(k===" "||k==="enter"){if(state==="title"||(state==="over"&&overT>0.8))tryBegin();}
  else if(k==="u"&&state!=="shop"){openShop();}
  else if(k==="escape"&&state==="shop"){state=prevScreen;}
});
function tryBegin(){
  if(limitInfo().blocked){state="title";sfx.click();return;}
  LS.set(playsKey(),playsUsed()+1);   // a try is counted when a run starts (per round)
  reset();state="play";sfx.start();
}
function openShop(){prevScreen=(state==="over")?"over":"title";state="shop";sfx.click();}

// ---------- player actions ----------
function doJump(){
  if(state!=="play")return;
  const mj=moonT>0?1.18:1;
  if(p.onGround||p.coyote>0){p.vy=-JV*mj;p.onGround=false;p.coyote=0;p.jumps=1;p.slam=false;p.squash=-0.25;sfx.jump();burst(PX,GY,["#9be8ff",PURP],8,180,600);}
  else if(p.jumps<2){p.vy=-DJV*mj;p.jumps=2;p.slam=false;p.squash=-0.3;sfx.djump();ring(PX,p.y-40,CYAN,90);burst(PX,p.y,[CYAN,"#ffffff",PURP],14,260,300);}
  else p.buffer=0.15;
}
function doSlam(){
  if(state!=="play"||p.onGround||p.slam)return;
  p.slam=true;p.vy=SLAMV;sfx.slam();slamCount++;
}
function slamImpact(){
  shake=Math.max(shake,0.55);sfx.impact();ring(PX,GY,CYAN,240);ring(PX,GY,PURP,170);
  burst(PX,GY,[CYAN,PURP,"#ffffff"],30,520,1400);
  let n=0;
  for(const e of ents){if((e.k==="red"||(e.k==="fud"&&e.y>GY-260))&&!e.dead&&e.x>PX-60&&e.x<PX+280){e.dead=true;n++;smashFx(e);}}
  for(const q of bp){if(q.k!=="sign"&&q.x>PX-60&&q.x<PX+260){q.dead=true;n++;burst(q.x,GY-30,[RED,"#ffffff"],16,380);}}
  if(n){bonus+=150*n*mult();popup(PX+120,GY-200,n>1?`SMASH x${n}!`:"SMASH!",CYAN,40);}
}
function smashFx(e){const y=e.k==="red"?GY-e.h/2:e.y;burst(e.x,y,e.k==="red"?[RED,"#ff9aa8","#fff"]:["#b49cff","#ff6a8a","#fff"],22,480);sfx.smash();}

// ---------- damage / pickups ----------
function hurt(label,x,y){
  if(shieldT>0){if(invuln<=0){popup(x,y-30,"DIAMOND HANDS 💎",CYAN,30);sfx.block();ring(PX,p.y-45,CYAN,130);invuln=0.35;}return true;}
  if(invuln>0)return false;
  lives--;combo=0;comboT=0;shake=1;hitFlash=1;invuln=1.5;mcap*=0.7;
  burst(PX,p.y-45,[RED,"#ff9aa8","#ffffff"],40,600);popup(x,y-40,label,RED,46);sfx.hit();
  if(lives<=0)gameOver();
  return true;
}
function collect(e){
  e.dead=true;combo++;comboT=2.4;bestCombo=Math.max(bestCombo,combo);
  const m=mult();
  if(e.k==="coin"){runCoins+=pumpT>0?2:1;bonus+=10*m;mcap*=1.004;sfx.coin(combo);burst(e.x,e.y,[GOLD,"#fff6c0"],8,220,400);if(combo%10===0)popup(e.x,e.y-30,`COMBO ${combo}!`,GOLD,30);}
  else{bonus+=60*m;mcap*=1.035;flash=1;sfx.green(combo);burst(e.x,e.y,[GREEN,CYAN,"#c8ffdc"],22,420);
    popup(e.x,e.y-36,GOOD[Math.floor(Math.random()*GOOD.length)],GREEN,34);if(m>1)popup(e.x,e.y-76,"x"+m,CYAN,26);}
  if(mcap>athMark){athMark=mcap*2;popup(W/2,GY-420,"ATH!",GOLD,64);sfx.ath();flash=1;}
}
function powerup(kind){
  sfx.power();flash=1;ring(PX,p.y-45,GOLD,200);burst(PX,p.y-45,[GOLD,CYAN,PURP],30,500);
  if(kind==="shield"){shieldT=shieldDur(upg.shield);popup(PX+40,p.y-140,"DIAMOND HANDS!",CYAN,38);}
  if(kind==="pump"){pumpT=9;popup(PX+40,p.y-140,"2x PUMP!",GREEN,42);}
  if(kind==="moon"){moonT=8;popup(PX+40,p.y-140,"MOON JUMP!",GOLD,40);}
  if(kind==="magnet"){magnetT=9;popup(PX+40,p.y-140,"WHALE MAGNET!",PINK,36);}
}

// ================= update =================
function update(dt){
  if(state==="play")updPlay(dt);
  else if(state==="over")overT+=dt;
  updFx(dt);
}
function onGroundAt(x){for(const q of pits){if(!q.filled&&q.x<=x-16&&q.x+q.w>=x+16)return false;}return true;}
function updPlay(dt){
  runT+=dt;
  // ---- boss scheduling
  if(!boss&&!bossPending){bossClock+=dt;if(bossClock>=BOSS_EVERY){bossPending=true;bossWait=0;}}
  if(bossPending){bossWait+=dt;const clear=!ents.some(e=>(e.k==="red"||e.k==="fud")&&e.x>PX-80)&&!pits.some(q=>!q.filled&&q.x+q.w>PX-40);
    if((bossWait>1.2&&clear)||bossWait>5)startBoss();}
  // ---- speed / distance / mcap
  const target=boss?Math.min(speed,640):Math.min(1050,430+runT*4.2);
  speed+=(target-speed)*Math.min(1,dt*1.5);
  const dx=speed*dt;scroll+=dx;dist+=dx/40;
  mcap*=1+dt*0.012*(speed/430);athMcap=Math.max(athMcap,mcap);
  // ---- timers
  if(invuln>0)invuln-=dt;
  if(shieldT>0)shieldT-=dt;if(pumpT>0)pumpT-=dt;if(moonT>0)moonT-=dt;if(magnetT>0)magnetT-=dt;
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  // ---- spawn
  if(!boss&&!bossPending){spawnAcc-=dx;if(spawnAcc<=0){const len=spawnPattern();const d=difficulty();spawnAcc=len+speed*(0.75-0.3*d)+R(0,220);}
    puT-=dt;if(puT<=0){spawnPowerup();puT=R(11,16);}}
  else if(boss){coinTrickle-=dt;if(coinTrickle<=0){coinTrickle=R(2.2,3.2);for(let i=0;i<4;i++)addCoin(W+60+i*70,55);}}
  // ---- move world
  for(const e of ents){e.x-=dx+(e.k==="fud"?60*dt:0);}
  for(const q of pits)q.x-=dx;
  ents=ents.filter(e=>!e.dead&&e.x>-160);pits=pits.filter(q=>q.x+q.w>-40);
  // ---- player physics
  const grav=G*(moonT>0?0.6:1),prevY=p.y;
  p.vy+=grav*dt;if(p.slam)p.vy=Math.max(p.vy,SLAMV);
  p.y+=p.vy*dt;
  const ground=onGroundAt(PX);
  if(p.onGround&&!ground){p.onGround=false;p.coyote=0.09;}
  if(!p.onGround&&p.coyote>0){p.coyote-=dt;if(p.coyote<=0&&p.jumps===0)p.jumps=1;}
  if(p.y>=GY&&prevY<=GY+4&&ground&&p.vy>=0){
    if(!p.onGround){p.squash=p.slam?0.45:0.25;if(p.slam)slamImpact();else burst(PX,GY,["#9be8ff",PURP],6,140,500);}
    p.y=GY;p.vy=0;p.onGround=true;p.jumps=0;p.slam=false;
    if(p.buffer>0){p.buffer=0;doJump();}
  }
  if(p.buffer>0)p.buffer-=dt;
  if(!p.onGround&&p.y>GY+4&&!ground&&shieldT>0&&p.vy>0){p.vy=-JV*1.05;p.slam=false;p.jumps=1;popup(PX+30,GY-120,"DIAMOND HANDS 💎",CYAN,30);sfx.block();}
  if(p.y>GY+190){ // fell into a RUG pit
    for(const q of pits)if(q.x<PX+320&&q.x+q.w>PX-120)q.filled=true;
    hurt("RUGGED!",PX+60,GY-60);
    if(state!=="play")return;
    p.y=GY-280;p.vy=-300;p.slam=false;p.jumps=1;p.onGround=false;invuln=Math.max(invuln,1.5);
  }
  p.squash*=Math.pow(0.0005,dt);
  const pb={x1:PX-30,x2:PX+30,y1:p.y-88,y2:p.y-8};
  // ---- entity interactions
  const mr=magnetRange(upg.magnet);
  for(const e of ents){
    if(e.dead)continue;
    if(e.k==="coin"||e.k==="g"){
      if(magnetT>0){const ddx=PX-e.x,ddy=(p.y-48)-e.y,d=Math.hypot(ddx,ddy);if(d<mr&&d>1){const s=Math.min(d,1500*dt);e.x+=ddx/d*s+dx;e.y+=ddy/d*s;}}
      const r=e.k==="coin"?24:30;if(ov(pb,{x1:e.x-r,x2:e.x+r,y1:e.y-r,y2:e.y+r}))collect(e);
    }else if(e.k==="pu"){if(ov(pb,{x1:e.x-36,x2:e.x+36,y1:e.y-36,y2:e.y+36})){e.dead=true;powerup(e.kind);}}
    else if(e.k==="red"){
      const top=GY-e.h,box={x1:e.x-e.w/2+4,x2:e.x+e.w/2-4,y1:top,y2:GY};
      if(ov(pb,box)){
        if(p.slam||(p.vy>0&&prevY-8<=top+6)){ // stomped / slammed from above
          e.dead=true;smashFx(e);bonus+=100*mult();popup(e.x,top-30,p.slam?"SMASH!":"STOMP!",CYAN,34);if(!p.slam){p.vy=-900;p.jumps=1;}
        }else if(hurt("RUG!",e.x,top)){e.dead=true;smashFx(e);}
      }
    }else if(e.k==="fud"){
      e.ph+=dt;const yy=e.y+Math.sin(e.ph*3)*14;
      if(ov(pb,{x1:e.x-e.r*0.9,x2:e.x+e.r*0.9,y1:yy-e.r*0.6,y2:yy+e.r*0.6})){
        if(p.slam){e.dead=true;smashFx(e);bonus+=120*mult();popup(e.x,yy-40,"FUD CLEARED",CYAN,30);}
        else if(hurt("FUD!",e.x,yy)){e.dead=true;smashFx(e);}
      }
    }
    if(state!=="play")return;
  }
  // ---- boss + boss projectiles
  if(boss)updBoss(dt,pb);
  if(state!=="play")return;
  for(const q of bp){
    q.x+=q.vx*dt;if(q.k==="rug")q.rot=(q.rot||0)-dt*12;
    const box=q.k==="sign"?{x1:q.x-44,x2:q.x+44,y1:q.y-22,y2:q.y+22}:q.k==="fud"?{x1:q.x-38,x2:q.x+38,y1:q.y-26,y2:q.y+26}:q.k==="wave"?{x1:q.x-22,x2:q.x+22,y1:GY-q.h,y2:GY}:{x1:q.x-28,x2:q.x+28,y1:GY-58,y2:GY};
    const qy=q.y||GY-40;
    if(!q.dead&&ov(pb,box)){
      if(p.slam&&q.k!=="wave"){q.dead=true;burst(q.x,qy,[RED,"#fff"],18,420);bonus+=100*mult();popup(q.x,qy-50,"BLOCKED",CYAN,28);}
      else if(hurt(q.k==="fud"?"FUD!":q.k==="sign"?"-99%!":q.k==="wave"?"REKT!":"RUG!",q.x,qy)){q.dead=true;burst(q.x,qy,[RED,"#fff"],18,420);}
    }
    if(state!=="play")return;
  }
  bp=bp.filter(q=>!q.dead&&q.x>-200&&q.x<W+600);
  // ---- dust
  if(p.onGround&&Math.random()<dt*speed/40)parts.push({x:PX-20,y:GY-2,vx:-speed*0.4-R(0,80),vy:-R(20,120),life:0,max:0.35,c:Math.random()<0.5?CYAN:PURP,g:300,s:2+Math.random()*2});
  score=Math.floor(dist)+Math.floor(bonus);
}
function updFx(dt){
  for(const q of parts){q.life+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;q.vx*=Math.pow(0.4,dt);}
  parts=parts.filter(q=>q.life<q.max);
  for(const q of pops)q.age+=dt;pops=pops.filter(q=>q.age<1.0);
  for(const r of rings){r.age+=dt;r.r+=(r.max-r.r)*Math.min(1,dt*8);}rings=rings.filter(r=>r.age<0.45);
  shake*=Math.pow(0.003,dt);flash*=Math.pow(0.001,dt);hitFlash*=Math.pow(0.01,dt);
  if(banner){banner.t+=dt;if(banner.t>banner.dur)banner=null;}
}

// ================= boss fights =================
const BOSS_NAMES={rug:"THE RUG PULLER",bear:"BEAR MARKET"};
const bossBX=()=>W-150,bossHover=()=>GY-300;
function startBoss(){
  bossPending=false;const type=bossCount%2===0?"rug":"bear";bossCount++;
  boss={type,x:W+240,y:bossHover(),hp:3,phase:"enter",pt:0,atkLeft:0,atkT:0,flash:0,fightT:0};
  banner={big:"⚠ BOSS FIGHT ⚠",small:BOSS_NAMES[type],col:RED,t:0,dur:2.4};
  sfx.alarm();shake=0.5;
}
function setPhase(ph){boss.phase=ph;boss.pt=0;}
function bossAttack(){
  const b=boss;sfx.attack();b.flash=0.25;
  if(b.type==="rug"){
    const a=["roll","pull","sign"][Math.floor(Math.random()*3)];
    if(a==="roll"){bp.push({k:"rug",x:b.x-40,vx:-(speed+240),rot:0});popup(b.x-40,b.y-200,"ROLL OUT!",PINK,26);}
    else if(a==="pull"){addPit(W+30,R(160,200));popup(b.x-20,b.y-200,"*PULLS RUG*",RED,28);}
    else{bp.push({k:"sign",x:b.x-50,y:GY-185,vx:-(speed+160)});popup(b.x-40,b.y-200,"-99%",RED,30);}
  }else{
    const a=["charge","roar","quake"][Math.floor(Math.random()*3)];
    if(a==="charge"){setPhase("charge");popup(b.x-30,b.y-200,"GRRR!",RED,34);}
    else if(a==="roar"){for(let i=0;i<3;i++)bp.push({k:"fud",x:b.x-40+i*190,y:GY-(170+Math.random()*40),vx:-(speed+120),ph:i});popup(b.x-30,b.y-200,"ROAR! FUD!",RED,30);}
    else{bp.push({k:"wave",x:b.x,h:62,vx:-(speed+260)});bp.push({k:"wave",x:b.x+380,h:62,vx:-(speed+260)});popup(b.x-30,b.y-200,"BEAR QUAKE!",RED,28);shake=Math.max(shake,0.3);}
  }
}
function bossBox(pad=0){const b=boss,hw=b.type==="bear"?80:62,hh=b.type==="bear"?165:180;return{x1:b.x-hw-pad,x2:b.x+hw+pad,y1:b.y-hh-pad,y2:b.y};}
function updBoss(dt,pb){
  const b=boss;b.pt+=dt;b.fightT+=dt;if(b.flash>0)b.flash-=dt;
  const BX=bossBX(),HY=bossHover(),gap=1.25-0.15*(3-b.hp);
  const ease=(a,t)=>a+(t-a)*Math.min(1,dt*4);
  switch(b.phase){
    case"enter":b.x=ease(b.x,BX);b.y=HY+Math.sin(b.fightT*3)*12;if(b.pt>1.6){setPhase("attack");b.atkLeft=3+(3-b.hp);b.atkT=0.5;}break;
    case"attack":b.x=ease(b.x,BX);b.y=HY+Math.sin(b.fightT*3)*12;
      b.atkT-=dt;if(b.atkT<=0){if(b.atkLeft>0){b.atkLeft--;b.atkT=gap;bossAttack();}else setPhase("dive");}break;
    case"charge":
      if(b.pt<0.7){b.y=ease(b.y,GY);b.x=ease(b.x,BX+20);}
      else{b.y=GY;b.x-=980*dt;if(ov(pb,bossBox()))hurt("BEARISH!",PX,p.y-60);
        if(b.x<-240){b.x=W+240;b.y=HY;setPhase("return");}}
      break;
    case"return":b.x=ease(b.x,BX);b.y=HY+Math.sin(b.fightT*3)*12;if(b.pt>0.9){b.phase="attack";b.atkT=gap*0.6;}break;
    case"dive":b.y=ease(b.y,GY);b.x=ease(b.x,BX);if(b.pt>0.55){b.y=GY;setPhase("vuln");shake=Math.max(shake,0.35);sfx.impact();burst(b.x,GY,[PURP,CYAN],20,400,1200);popup(b.x,GY-230,"SLAM IT!",GOLD,40);}break;
    case"vuln":b.y=GY;b.x-=250*dt;
      if(p.slam&&ov(pb,bossBox(18))){ // slammed!
        b.hp--;b.flash=0.5;setPhase("hurt");shake=1;flash=1;sfx.bossHit();
        burst(b.x,GY-90,[GOLD,CYAN,PURP,"#ffffff"],60,700);ring(b.x,GY-80,GOLD,260);
        p.vy=-1250;p.slam=false;p.jumps=1;p.onGround=false;bonus+=500*mult();
        popup(b.x,GY-260,b.hp>0?`HIT ${3-b.hp}/3!`:"FINAL HIT!",GOLD,48);
      }else if(b.x<PX-150){popup(PX+150,GY-300,"MISSED! JUMP + SWIPE DOWN",PINK,24);setPhase("recover");}
      break;

  for(const [k,tl,mx] of chips){if(tl<=0)continue;const inf=PU_INFO[k];panel(cx,158,118,40,inf.col);
    ctx.textAlign="left";ctx.textBaseline="middle";ctx.font=k==="pump"?`900 17px ${FONT}`:"18px sans-serif";ctx.fillStyle=inf.col;ctx.fillText(inf.icon,cx+10,178);
    ctx.fillStyle="rgba(255,255,255,.15)";ctx.fillRect(cx+44,172,62,10);ctx.fillStyle=inf.col;ctx.fillRect(cx+44,172,62*clamp(tl/mx,0,1),10);cx+=126;}
  if(boss){
    panel(W/2-190,212,380,64,RED,"rgba(30,4,10,.85)");
    glowText(BOSS_NAMES[boss.type],W/2,232,`900 20px ${FONT}`,"#ff9aa8",10);
    for(let i=0;i<3;i++){ctx.fillStyle=i<boss.hp?RED:"rgba(255,50,80,.2)";rr(ctx,W/2-150+i*104,248,92,16,6);ctx.fill();}
  }else if(!bossPending&&state==="play"){const left=Math.max(0,BOSS_EVERY-bossClock);ctx.textAlign="right";ctx.textBaseline="middle";ctx.font=`700 16px ${FONT}`;ctx.fillStyle=left<8?(Math.floor(time*4)%2?RED:"#ff9aa8"):"#8a86c8";ctx.fillText(`BOSS IN ${Math.ceil(left)}s`,W-24,178);}
  ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.font=`600 15px ${FONT}`;ctx.fillStyle="#786ec8";ctx.fillText(`OHIO FINAL BOSS  //  HI ${high}`,W/2,H-22);
}
function drawFx(){
  for(const r of rings){const k=1-r.age/0.45;ctx.globalAlpha=k;ctx.strokeStyle=r.col;ctx.lineWidth=5*k+1;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();}
  ctx.globalAlpha=1;
  for(const q of parts){const k=1-q.life/q.max;ctx.globalAlpha=k;ctx.fillStyle=q.c;ctx.fillRect(q.x-q.s*k,q.y-q.s*k,q.s*2*k+1,q.s*2*k+1);}
  ctx.globalAlpha=1;
  for(const q of pops){const k=1-q.age/1.0;ctx.globalAlpha=Math.min(1,k*1.6);const sc=1+0.35*Math.max(0,1-q.age*6);
    ctx.font=`900 ${Math.round(q.size*sc)}px ${FONT}`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineWidth=6;ctx.strokeStyle="#000";
    const tw=ctx.measureText(q.text).width/2+12,x=clamp(q.x,tw,W-tw),y=q.y-q.age*100;
    ctx.strokeText(q.text,x,y);ctx.shadowColor=q.col;ctx.shadowBlur=14;ctx.fillStyle=q.col;ctx.fillText(q.text,x,y);ctx.shadowBlur=0;}
  ctx.globalAlpha=1;
}
function drawBanner(time){
  if(!banner)return;const k=banner.t,a=Math.min(1,k*5,(banner.dur-k)*4);ctx.globalAlpha=Math.max(0,a);
  const y=H*0.36;ctx.fillStyle="rgba(10,2,8,.75)";ctx.fillRect(0,y-80,W,160);
  ctx.fillStyle=banner.col;for(let i=-2;i<16;i++){const x=i*60+((time*120)%60);ctx.beginPath();ctx.moveTo(x,y-80);ctx.lineTo(x+30,y-80);ctx.lineTo(x+18,y-68);ctx.lineTo(x-12,y-68);ctx.fill();ctx.beginPath();ctx.moveTo(x,y+68);ctx.lineTo(x+30,y+68);ctx.lineTo(x+18,y+80);ctx.lineTo(x-12,y+80);ctx.fill();}
  const sc=1+0.25*Math.max(0,1-k*4);glowText(banner.big,W/2,y-18,`900 ${Math.round(56*sc)}px ${FONT}`,banner.col,26);
  glowText(banner.small,W/2,y+36,`800 ${banner.small.length>24?20:30}px ${FONT}`,"#ffffff",12);ctx.globalAlpha=1;
}

// ---------- menus (canvas buttons) ----------
let buttons=[],last=performance.now(),clock=0,scanPat=null;
function button(id,x,y,w,h,label,col,enabled=true,sub=null){
  buttons.push({id,x,y,w,h,enabled});
  const pulse=enabled&&(id==="play"||id==="again")?0.5+0.5*Math.sin(clock*5):0;
  rr(ctx,x,y,w,h,16);ctx.fillStyle=enabled?"rgba(12,14,44,.92)":"rgba(30,30,40,.8)";ctx.fill();
  ctx.shadowColor=col;ctx.shadowBlur=enabled?14+14*pulse:0;ctx.strokeStyle=enabled?col:"#555";ctx.lineWidth=3.5;ctx.stroke();ctx.shadowBlur=0;
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`900 ${h>80?34:24}px ${FONT}`;ctx.fillStyle=enabled?"#ffffff":"#888";ctx.fillText(label,x+w/2,y+h/2+(sub?-12:1));
  if(sub){ctx.font=`700 17px ${FONT}`;ctx.fillStyle=enabled?col:"#999";ctx.fillText(sub,x+w/2,y+h/2+22);}
}
function uiTap(pt){
  const b=buttons.find(b=>pt.x>=b.x&&pt.x<=b.x+b.w&&pt.y>=b.y&&pt.y<=b.y+b.h);
  if(state==="title"){if(b&&b.id==="shop")return openShop();if(!limitInfo().blocked)tryBegin();return;}
  if(state==="over"){if(!b)return;if(b.id==="again"&&b.enabled&&overT>0.8)return tryBegin();if(b.id==="shop")return openShop();if(b.id==="menu"){state="title";sfx.click();}return;}
  if(state==="shop"){if(!b)return;if(b.id==="back"){state=prevScreen;sfx.click();return;}
    if(b.id.startsWith("buy:")&&b.enabled){const u=UPG.find(u=>u.id===b.id.slice(4)),lv=upg[u.id];if(lv<u.max&&bank>=u.cost[lv]){bank-=u.cost[lv];upg[u.id]=lv+1;saveBank();sfx.buy();
      burst(b.x+b.w/2,b.y+b.h/2,[GOLD,CYAN,GREEN],30,500);popup(W/2,b.y-24,`${u.name} LV ${lv+1}!`,GOLD,30);}}
  }
}
const PRIZE_MAIN="🎮 PRACTICE MODE · NOT ELIGIBLE FOR PRIZES. Prizes only in ranked mode (Phantom): 3 tries per 3-day round, top 10 can win SOL paid only from creator fees actually received. Rewards pending the official rules post on X @TheBossCoin_SOL; not guaranteed.";
const PRIZE_SUB="No purchase or token needed to play or win. Not financial advice.";
function drawPrizeNotice(y){
  ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font=`800 21px ${FONT}`;const m=wrapLines(PRIZE_MAIN,600);
  const h=20+m.length*29+58;
  rr(ctx,36,y,W-72,h,12);ctx.fillStyle="rgba(30,22,4,0.9)";ctx.fill();ctx.strokeStyle=GOLD;ctx.lineWidth=2.5;ctx.shadowColor="#ffb400";ctx.shadowBlur=14;ctx.stroke();ctx.shadowBlur=0;
  let yy=y+24;ctx.font=`800 21px ${FONT}`;ctx.fillStyle="#ffe27a";for(const l of m){ctx.fillText(l,W/2,yy);yy+=29;}
  ctx.font=`500 15px ${FONT}`;ctx.fillStyle="#d9cfa8";ctx.fillText(PRIZE_SUB,W/2,yy+4);
  ctx.font=`800 17px ${FONT}`;ctx.fillStyle="#78e6ff";ctx.fillText(roundText(),W/2,yy+32);
  ctx.restore();return h;
}
function drawLogo(cx,cy,r){if(logo.complete&&logo.naturalWidth){ctx.save();ctx.shadowColor=PURP;ctx.shadowBlur=40;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle=CYAN;ctx.lineWidth=4;ctx.stroke();ctx.clip();ctx.drawImage(logo,cx-r,cy-r,r*2,r*2);ctx.restore();}}
function drawScreens(time){
  buttons=[];
  const oy=Math.max(0,(H-1180)*0.35);
  if(state==="title"){
    ctx.fillStyle="rgba(4,5,16,0.62)";ctx.fillRect(0,0,W,H);
    drawLogo(W/2,oy+170,100);
    glowText("$BOSS RUNNER",W/2,oy+330,`900 66px ${FONT}`,"#78e6ff",28);
    glowText("— Ohio Final Boss —",W/2,oy+388,`700 30px ${FONT}`,"#c8a0ff",18);
    const li=limitInfo();
    if(li.blocked){
      panel(60,oy+424,W-120,176,RED,"rgba(30,4,10,.9)");
      glowText("OUT OF TRIES",W/2,oy+468,`900 40px ${FONT}`,RED,18);
      glowText(`You've used your ${li.max}/${li.max} tries.`,W/2,oy+520,`700 24px ${FONT}`,"#ffe27a",10);
      glowText("New tries next round · Thanks for playing! 👑",W/2,oy+562,`700 20px ${FONT}`,"#78e6ff",10);
      button("shop",160,oy+616,W-320,72,"🛒 UPGRADES",GOLD);
    }else{
      glowText(`Practice tries left: ${li.left}/${li.max}`,W/2,oy+442,`800 26px ${FONT}`,li.left>0?GREEN:RED,12);
      button("play",130,oy+474,W-260,108,"▶ TAP TO PLAY",CYAN);
      button("shop",160,oy+600,W-320,72,"🛒 UPGRADES",GOLD);
    }
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`600 19px ${FONT}`;
    ctx.fillStyle="#cfe8ff";ctx.fillText("TAP = jump · TAP AGAIN = double jump",W/2,oy+718);
    ctx.fillText("SWIPE DOWN = slam   (keys: SPACE/↑ and ↓)",W/2,oy+746);
    ctx.fillStyle="#ff7a8e";ctx.fillText("Dodge red candles, RUG pits & FUD clouds",W/2,oy+780);
    ctx.fillStyle=GREEN;ctx.fillText("Grab green candles, $BOSS coins & power-ups",W/2,oy+808);
    ctx.fillStyle=GOLD;ctx.fillText("Every ~45s a BOSS FIGHT: dodge, then slam it 3x",W/2,oy+836);
    ctx.fillStyle="#8a86c8";ctx.font=`700 18px ${FONT}`;ctx.fillText(`HIGH SCORE ${high}  ·  BEST ${bestDist}m  ·  BANK ${bank} $BOSS`,W/2,oy+870);
    drawPrizeNotice(oy+896);
  }else if(state==="over"){
    ctx.fillStyle=`rgba(4,5,16,${Math.min(0.8,overT*2)})`;ctx.fillRect(0,0,W,H);
    glowText("GAME OVER",W/2,oy+130,`900 70px ${FONT}`,RED,30);
    glowText("RUGGED IN OHIO",W/2,oy+192,`700 24px ${FONT}`,"#ff9aa8",12);
    panel(60,oy+230,W-120,334,PURP);
    const row=(l,v,y,c)=>{ctx.textAlign="left";ctx.textBaseline="middle";ctx.font=`600 21px ${FONT}`;ctx.fillStyle="#9fb0e0";ctx.fillText(l,90,y);ctx.textAlign="right";ctx.font=`800 26px ${FONT}`;ctx.fillStyle=c;ctx.fillText(v,W-90,y);};
    row("SCORE",String(score),oy+270,"#e6faff");row("DISTANCE",Math.floor(dist)+"m",oy+312,"#82c8ff");row("MCAP / ATH",`${fmtMcap(mcap)} / ${fmtMcap(athMcap)}`,oy+354,GREEN);
    row("$BOSS EARNED","+"+runCoins+"  (bank "+bank+")",oy+396,GOLD);row("BOSSES REKT",String(bossesBeaten),oy+438,PINK);row("BEST COMBO",String(bestCombo),oy+480,"#c8a0ff");row("HIGH SCORE",String(high),oy+522,"#e6faff");
    if(newHigh){ctx.globalAlpha=0.5+0.5*Math.sin(time*8);glowText("NEW HIGH SCORE!",W/2,oy+596,`900 32px ${FONT}`,"#ffe45a",20);ctx.globalAlpha=1;}
    const li=limitInfo(),en=overT>0.8;
    if(li.blocked)button("again",110,oy+630,W-220,100,"NO TRIES LEFT",RED,false,"New tries next round · Thanks for playing! 👑");
    else button("again",110,oy+630,W-220,100,"▶ PLAY AGAIN",CYAN,en,`Tries left: ${li.left}/${li.max}`);
    button("shop",110,oy+746,(W-240)/2,72,"🛒 SHOP",GOLD,true);button("menu",130+(W-240)/2,oy+746,(W-240)/2,72,"MENU",PURP,true);
    drawPrizeNotice(oy+840);
  }else if(state==="shop"){
    ctx.fillStyle="rgba(4,5,16,0.86)";ctx.fillRect(0,0,W,H);
    glowText("UPGRADE SHOP",W/2,oy+100,`900 54px ${FONT}`,GOLD,24);
    if(layers)ctx.drawImage(layers.coin.c,W/2-140,oy+142,46,46);glowText(`${bank} $BOSS`,W/2+26,oy+166,`900 36px ${FONT}`,"#ffe27a",12);
    ctx.font=`600 17px ${FONT}`;ctx.fillStyle="#9fb0e0";ctx.textAlign="center";ctx.fillText("Coins you collect are saved. Upgrades are permanent.",W/2,oy+214);
    UPG.forEach((u,i)=>{
      const y=oy+242+i*178,lv=upg[u.id],maxed=lv>=u.max,cost=maxed?0:u.cost[lv],can=!maxed&&bank>=cost;
      panel(40,y,W-80,160,maxed?GREEN:CYAN);
      ctx.textAlign="left";ctx.textBaseline="middle";ctx.font="44px sans-serif";ctx.fillStyle="#fff";ctx.fillText(u.icon,60,y+56);
      ctx.font=`900 26px ${FONT}`;ctx.fillStyle="#e6faff";ctx.fillText(u.name,126,y+38);
      ctx.font=`600 18px ${FONT}`;ctx.fillStyle="#a8b4e8";ctx.fillText(u.desc(lv),126,y+72);
      if(!maxed){ctx.fillStyle=GREEN;ctx.fillText("next: "+u.desc(lv+1).replace(/^[A-Za-z ]+/,""),126,y+98);}
      for(let k=0;k<u.max;k++){ctx.fillStyle=k<lv?GREEN:"rgba(255,255,255,.15)";rr(ctx,126+k*40,y+122,32,16,5);ctx.fill();}
      button("buy:"+u.id,W-250,y+88,190,56,maxed?"MAX":`BUY ${cost}`,maxed?GREEN:GOLD,can);
    });
    button("back",180,oy+786,W-360,76,"◀ BACK",CYAN);
    drawPrizeNotice(oy+890);
  }
}

// ================= main loop =================
function frame(now){
  const rdt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;clock+=rdt;
  try{
    if(state==="play"){let total=rdt*timeScale;while(total>1e-6&&state==="play"){const d=Math.min(total,1/60);update(d);total-=d;}}
    else{update(rdt);scroll+=rdt*(state==="over"?0:260);}
    render();
  }catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
function render(){
  ctx.setTransform(DPR*scale,0,0,DPR*scale,0,0);
  let sx=0,sy=0;if(shake>0.02){const a=20*shake;sx=(Math.random()*2-1)*a;sy=(Math.random()*2-1)*a;}
  ctx.save();ctx.translate(sx,sy);
  drawBG(clock);
  const inRun=state==="play"||state==="over";
  if(inRun){
    for(const e of ents){if(e.k==="red")drawRed(e);else if(e.k==="g")drawGreen(e,clock);else if(e.k==="coin")drawCoin(e,clock);else if(e.k==="fud")drawFud(e.x,e.y+Math.sin(e.ph*3)*14,e.r,clock);else if(e.k==="pu")drawPU(e,clock);}
    drawBoss(clock);for(const q of bp)drawProj(q,clock);
    drawPlayer(clock);
  }else if(spr.complete&&spr.naturalWidth){ // attract mode: the crown hops along on the menus
    const yb=GY-Math.abs(Math.sin(clock*3))*120;ctx.globalAlpha=0.9;ctx.drawImage(spr,PX-52,yb-110,104,114);ctx.globalAlpha=1;
  }
  if(inRun)drawFx();
  ctx.restore();
  if(flash>0.02){ctx.fillStyle=`rgba(40,255,140,${0.08*flash})`;ctx.fillRect(0,0,W,H);}
  if(hitFlash>0.02){ctx.fillStyle=`rgba(255,40,70,${0.3*hitFlash})`;ctx.fillRect(0,0,W,H);}
  if(inRun)drawHUD(clock);
  if(state==="play")drawBanner(clock);
  drawScreens(clock);
  if(state==="shop")drawFx();
  if(!scanPat){const s=document.createElement("canvas");s.width=4;s.height=3;const g=s.getContext("2d");g.fillStyle="rgba(0,0,0,0.2)";g.fillRect(0,0,4,1);scanPat=ctx.createPattern(s,"repeat");}
  ctx.fillStyle=scanPat;ctx.fillRect(0,0,W,H);
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.75);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,0.4)");ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
reset();resize();
if(document.fonts&&document.fonts.load)document.fonts.load(`800 30px Orbitron`).then(()=>{layers=null;}).catch(()=>{});
document.addEventListener("visibilitychange",()=>{last=performance.now();});
requestAnimationFrame(frame);
})();
</script>
